# Builds LocalLM Chat for macOS, Windows and Linux.
#
# Push a tag like v0.1.0 to build everything and publish a GitHub Release with the installers.
# "Run workflow" on the Actions tab builds without releasing (the files are kept as artifacts).
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            args: --mac --arm64 --x64
          - name: Windows
            os: windows-latest
            args: --win --x64 --arm64
          - name: Linux
            os: ubuntu-latest
            args: --linux --x64 --arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build installers
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # No Apple or Windows signing certificate yet: the macOS app is ad-hoc signed.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: LocalLM-Chat-${{ matrix.name }}
          if-no-files-found: error
          # Windows also gets a combined x64+arm64 installer (…-win.exe); only the per-arch ones ship.
          path: |
            dist/*.dmg
            dist/*-win-*.exe
            dist/*.AppImage
            dist/*.deb

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "LocalLM Chat ${GITHUB_REF_NAME#v}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
